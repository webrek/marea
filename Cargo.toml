[workspace]
resolver = "2"
members = [
    "crates/marea-syntax",
    "crates/marea-types",
    "crates/marea-codegen",
    "crates/marea-wasm",
    "crates/marea-cli",
    "crates/marea-lsp",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Arturo Hernández <webrek@me.com>"]

# Dependencias externas del servidor de lenguaje (`marea-lsp`). Quedan
# centralizadas aquí para fijar versiones, pero SOLO las consume `marea-lsp`:
# los crates del compilador siguen siendo 100% std.
[workspace.dependencies]
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
opt-level = 3
lto = "thin"
